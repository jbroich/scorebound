name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scorebound
          POSTGRES_USER: scorebound
          POSTGRES_PASSWORD: scorebound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scorebound -d scorebound"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCOREBOUND_DB_URL: jdbc:postgresql://localhost:5432/scorebound
      SCOREBOUND_DB_USERNAME: scorebound
      SCOREBOUND_DB_PASSWORD: scorebound
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  packaging:
    name: ARM64 container build
    runs-on: ubuntu-latest
    env:
      SCOREBOUND_DB_PASSWORD: ci-compose-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image for ARM64
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: scorebound-api:ci
          cache-from: type=gha,scope=scorebound-api-arm64
          cache-to: type=gha,mode=max,scope=scorebound-api-arm64
      - name: Build frontend image for ARM64
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: scorebound-web:ci
          cache-from: type=gha,scope=scorebound-web-arm64
          cache-to: type=gha,mode=max,scope=scorebound-web-arm64
