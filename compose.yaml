name: scorebound

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SCOREBOUND_DB_NAME:-scorebound}
      POSTGRES_USER: ${SCOREBOUND_DB_USERNAME:-scorebound}
      POSTGRES_PASSWORD: ${SCOREBOUND_DB_PASSWORD:?Set SCOREBOUND_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  api:
    image: scorebound-api:${SCOREBOUND_IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SCOREBOUND_DB_URL: jdbc:postgresql://database:5432/${SCOREBOUND_DB_NAME:-scorebound}
      SCOREBOUND_DB_USERNAME: ${SCOREBOUND_DB_USERNAME:-scorebound}
      SCOREBOUND_DB_PASSWORD: ${SCOREBOUND_DB_PASSWORD:?Set SCOREBOUND_DB_PASSWORD in .env}
      SCOREBOUND_BOOTSTRAP_ADMIN_USERNAME: ${SCOREBOUND_BOOTSTRAP_ADMIN_USERNAME:-}
      SCOREBOUND_BOOTSTRAP_ADMIN_PASSWORD: ${SCOREBOUND_BOOTSTRAP_ADMIN_PASSWORD:-}
      SCOREBOUND_SESSION_COOKIE_SECURE: ${SCOREBOUND_SESSION_COOKIE_SECURE:-true}
      SCOREBOUND_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      SERVER_SHUTDOWN: graceful
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 30s
    networks:
      - internal

  web:
    image: scorebound-web:${SCOREBOUND_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SCOREBOUND_TIME_ZONE: ${SCOREBOUND_TIME_ZONE:-Europe/Berlin}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SCOREBOUND_HTTP_BIND:-127.0.0.1}:${SCOREBOUND_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  postgres-data:

networks:
  internal:
    internal: true
