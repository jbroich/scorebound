spring.application.name=Scorebound

spring.datasource.url=${SCOREBOUND_DB_URL:jdbc:postgresql://localhost:5432/scorebound}
spring.datasource.username=${SCOREBOUND_DB_USERNAME:scorebound}
spring.datasource.password=${SCOREBOUND_DB_PASSWORD:scorebound}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SCOREBOUND_SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=${SCOREBOUND_FORWARD_HEADERS_STRATEGY:NONE}

scorebound.bootstrap.admin.username=${SCOREBOUND_BOOTSTRAP_ADMIN_USERNAME:}
scorebound.bootstrap.admin.password=${SCOREBOUND_BOOTSTRAP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info
